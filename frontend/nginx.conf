server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy so the interviewer only ever needs one URL:
    # the browser calls /api/... and /health on this origin, and nginx
    # forwards them to the backend container over the internal Docker
    # network. The backend's own routes are unchanged.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # React Router client-side routing: any path not matching a real file
    # falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
